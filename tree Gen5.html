<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>读书养小树</title>
    <style>
        /* 保持原有样式不变 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(to bottom, #e0f7fa, #b2ebf2);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            color: #2e7d32;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: #388e3c;
            margin-bottom: 15px;
        }
        
        .slogan {
            font-style: italic;
            color: #558b2f;
            font-size: 1.1rem;
            margin-bottom: 10px;
        }
        
        .datetime {
            color: #2e7d32;
            font-size: 2.5rem;
        }
        
        .main-content {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .garden-container {
            flex: 1;
            min-width: 300px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        
        /* 全屏按钮样式 */
        .fullscreen-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 30px;
            height: 30px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        
        /* 全屏模式样式 */
        .fullscreen-garden {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        
        .exit-fullscreen {
            position: absolute;
            top: 0px;
            right: 0px;
            width: 0px;
            height: 0px;
            background: #f5f5f5;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 20px;
            z-index: 1001;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .garden-title {
            font-size: 1.5rem;
            color: #2e7d32;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .garden {
            width: 100%;
            height: 400px;
            background: #c8e6c9;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            border: 3px solid #81c784;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }
        
        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 60px;
            background: #8d6e63;
            border-top: 5px solid #5d4037;
        }
        
        .tree {
            position: absolute;
            bottom: 60px;
            transition: all 0.5s ease;
        }
        
        .small-tree {
            width: 60px;
            height: 120px;
        }
        
        .big-tree {
            width: 100px;
            height: 200px;
        }
        
        .huge-tree {
            width: 160px;
            height: 300px;
        }
        
        .controls-container {
            flex: 1;
            min-width: 300px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        .controls-title {
            font-size: 1.5rem;
            color: #2e7d32;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .control-group {
            margin-bottom: 25px;
        }
        
        .control-label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #388e3c;
        }
        
        .slider-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .slider {
            flex: 1;
            height: 10px;
            -webkit-appearance: none;
            appearance: none;
            background: #c8e6c9;
            border-radius: 5px;
            outline: none;
        }
        
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #2e7d32;
            cursor: pointer;
        }
        
        .value-display {
            min-width: 50px;
            text-align: center;
            font-weight: bold;
            color: #2e7d32;
        }
        
        .status-display {
            margin-top: 20px;
            padding: 15px;
            background: #e8f5e9;
            border-radius: 10px;
            border-left: 5px solid #4caf50;
        }
        
        .status-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #2e7d32;
        }
        
        .status-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        
        .timer-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            min-width: 250px;
            z-index: 100;
        }
        
        .timer-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #2e7d32;
            text-align: center;
        }
        
        .timer-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        
        .mic-status {
            text-align: center;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            font-weight: bold;
        }
        
        .mic-on {
            background: #e8f5e9;
            color: #2e7d32;
        }
        
        .mic-off {
            background: #ffebee;
            color: #c62828;
        }
        
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        
        .btn:hover {
            background: #388e3c;
        }
        
        .btn:disabled {
            background: #a5d6a7;
            cursor: not-allowed;
        }
        
        .current-db {
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            margin: 15px 0;
            color: #2e7d32;
        }
        
        .db-meter {
            height: 20px;
            background: #e0e0e0;
            border-radius: 10px;
            margin: 15px 0;
            overflow: hidden;
        }
        
        .db-level {
            height: 100%;
            background: linear-gradient(to right, #4caf50, #ffeb3b, #f44336);
            width: 0%;
            transition: width 0.3s;
        }
        
        /* 添加树动画效果 */
        @keyframes grow {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        
        .tree {
            animation: grow 0.8s ease-out forwards;
        }
        
        /* 枯萎动画 */
        @keyframes wither {
            from { transform: scale(1); opacity: 1; }
            to { transform: scale(0.8); opacity: 0.3; }
        }
        
        .tree-wither {
            animation: wither 0.5s ease-out forwards;
        }
        
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            
            .timer-container {
                position: static;
                margin-top: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>读书养小树</h1>
            <div class="subtitle">朗朗书声，茁壮成长</div>
            <div class="slogan">"大声朗读，让小树见证你的成长！"</div>
            <div class="datetime" id="datetime"></div>
        </header>
        
        <div class="main-content">
            <div class="garden-container" id="gardenContainer">
                <button class="fullscreen-btn" id="fullscreenBtn">
                    <!-- 全屏图标 -->
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M3 3H6V6H3V3Z" fill="white"/>
                        <path d="M10 3H13V6H10V3Z" fill="white"/>
                        <path d="M3 10H6V13H3V10Z" fill="white"/>
                        <path d="M10 10H13V13H10V10Z" fill="white"/>
                    </svg>
                </button>
                <div class="garden-title">我的朗读花园</div>
                <div class="garden" id="garden">
                    <div class="ground"></div>
                    <!-- 小树将通过JavaScript动态添加 -->
                </div>
                <div class="current-db">当前音量：<span id="currentDb">0</span> 分贝</div>
                <div class="db-meter">
                    <div class="db-level" id="dbLevel"></div>
                </div>
                <div class="mic-status" id="micStatus">麦克风未开启</div>
                <button class="btn" id="startBtn">开始朗读检测</button>
            </div>
            
            <div class="controls-container">
                <div class="controls-title">教师控制面板</div>
                
                <div class="control-group">
                    <label class="control-label">生长所需音量（分贝）</label>
                    <div class="slider-container">
                        <input type="range" min="0" max="90" value="45" class="slider" id="growDbSlider">
                        <div class="value-display" id="growDbValue">45</div>
                    </div>
                </div>
                
                <div class="control-group">
                    <label class="control-label">枯萎音量线（分贝）</label>
                    <div class="slider-container">
                        <input type="range" min="0" max="70" value="35" class="slider" id="shrinkDbSlider">
                        <div class="value-display" id="shrinkDbValue">35</div>
                    </div>
                </div>
                
                <div class="control-group">
                    <label class="control-label">生长所需持续时间（秒）</label>
                    <div class="slider-container">
                        <input type="range" min="0" max="20" value="10" class="slider" id="growTimeSlider">
                        <div class="value-display" id="growTimeValue">10</div>
                    </div>
                </div>
                
                <div class="control-group">
                    <label class="control-label">消失所需持续时间（秒）</label>
                    <div class="slider-container">
                        <input type="range" min="0" max="20" value="10" class="slider" id="shrinkTimeSlider">
                        <div class="value-display" id="shrinkTimeValue">10</div>
                    </div>
                </div>
                
                <div class="status-display">
                    <div class="status-title">花园状态</div>
                    <div class="status-item">
                        <span>当前小树数量：</span>
                        <span id="treeCount">0</span>
                    </div>
                    <div class="status-item">
                        <span>大树数量：</span>
                        <span id="bigTreeCount">0</span>
                    </div>
                    <div class="status-item">
                        <span>大大树数量：</span>
                        <span id="hugeTreeCount">0</span>
                    </div>
                    <div class="status-item">
                        <span>达到音量要求：</span>
                        <span id="meetingRequirement">否</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="timer-container">
            <div class="timer-title">朗读计时器</div>
            <div class="timer-item">
                <span>达到音量要求时间：</span>
                <span id="meetingTime">00:00</span>
            </div>
            <div class="timer-item">
                <span>未达到音量要求时间：</span>
                <span id="notMeetingTime">00:00</span>
            </div>
            <div class="timer-item">
                <span>当前连续达标时间：</span>
                <span id="currentMeetingTime">00:00</span>
            </div>
            <div class="timer-item">
                <span>当前连续未达标时间：</span>
                <span id="currentNotMeetingTime">00:00</span>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let audioContext;
        let analyser;
        let microphone;
        let javascriptNode;
        let isMonitoring = false;
        let trees = [];
        let meetingTime = 0;
        let notMeetingTime = 0;
        let currentMeetingTime = 0;
        let currentNotMeetingTime = 0;
        let lastDbValue = 0;
        let lastStatus = null; // 记录上一次的状态
        let consecutiveCheckInterval; // 连续状态检查定时器
        let isFullscreen = false; // 全屏状态标记
        
        // 配置参数 - 4个低级树合成1个高级树
        let config = {
            growDb: 45,
            shrinkDb: 35,
            growTime: 10,
            shrinkTime: 10,
            treesToUpgrade: 6, // 4个低级树合成1个高级树
            dbSmoothingFactor: 0.7
        };
        
        // DOM元素
        const startBtn = document.getElementById('startBtn');
        const currentDbElement = document.getElementById('currentDb');
        const dbLevelElement = document.getElementById('dbLevel');
        const micStatusElement = document.getElementById('micStatus');
        const gardenElement = document.querySelector('.garden');
        const gardenContainer = document.getElementById('gardenContainer');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const treeCountElement = document.getElementById('treeCount');
        const bigTreeCountElement = document.getElementById('bigTreeCount');
        const hugeTreeCountElement = document.getElementById('hugeTreeCount');
        const meetingRequirementElement = document.getElementById('meetingRequirement');
        const meetingTimeElement = document.getElementById('meetingTime');
        const notMeetingTimeElement = document.getElementById('notMeetingTime');
        const currentMeetingTimeElement = document.getElementById('currentMeetingTime');
        const currentNotMeetingTimeElement = document.getElementById('currentNotMeetingTime');
        const datetimeElement = document.getElementById('datetime');
        
        // 滑块元素
        const growDbSlider = document.getElementById('growDbSlider');
        const shrinkDbSlider = document.getElementById('shrinkDbSlider');
        const growTimeSlider = document.getElementById('growTimeSlider');
        const shrinkTimeSlider = document.getElementById('shrinkTimeSlider');
        
        // 滑块值显示元素
        const growDbValue = document.getElementById('growDbValue');
        const shrinkDbValue = document.getElementById('shrinkDbValue');
        const growTimeValue = document.getElementById('growTimeValue');
        const shrinkTimeValue = document.getElementById('shrinkTimeValue');
        
        // 初始化函数
        function init() {
            // 设置滑块事件监听
            growDbSlider.addEventListener('input', updateGrowDb);
            shrinkDbSlider.addEventListener('input', updateShrinkDb);
            growTimeSlider.addEventListener('input', updateGrowTime);
            shrinkTimeSlider.addEventListener('input', updateShrinkTime);
            
            // 设置开始按钮事件
            startBtn.addEventListener('click', toggleMonitoring);
            
            // 设置全屏按钮事件
            fullscreenBtn.addEventListener('click', toggleFullscreen);
            
            // 初始化显示值
            updateDisplayValues();
            
            // 开始计时器
            startTimers();
            
            // 初始化并启动日期时间显示
            updateDateTime();
            setInterval(updateDateTime, 1000);
        }
        
        // 更新日期时间显示
        function updateDateTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            datetimeElement.textContent = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
        }
        
        // 全屏切换功能
        function toggleFullscreen() {
            if (!isFullscreen) {
                // 保存原始状态
                gardenContainer.dataset.originalParent = gardenContainer.parentElement.id;
                gardenContainer.dataset.originalPosition = gardenContainer.style.position;
                gardenContainer.dataset.originalWidth = gardenContainer.style.width;
                gardenContainer.dataset.originalHeight = gardenContainer.style.height;
                
                // 创建退出全屏按钮
                const exitBtn = document.createElement('button');
                exitBtn.className = 'exit-fullscreen';
                exitBtn.id = 'exitFullscreenBtn';
                exitBtn.innerHTML = `
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M3 17L8 12H3V7H8L3 2V17Z" fill="white"/>
                        <path d="M17 3L12 8H17V13H12L17 18V3Z" fill="white"/>
                    </svg>
                `;
                exitBtn.addEventListener('click', toggleFullscreen);
                document.body.appendChild(exitBtn);
                
                // 进入全屏模式
                gardenContainer.classList.add('fullscreen-garden');
                gardenContainer.style.width = '100%';
                gardenContainer.style.height = '100%';
                gardenElement.style.height = '80vh';
                document.body.appendChild(gardenContainer);
                
                isFullscreen = true;
            } else {
                // 退出全屏模式
                const exitBtn = document.getElementById('exitFullscreenBtn');
                if (exitBtn) exitBtn.remove();
                
                gardenContainer.classList.remove('fullscreen-garden');
                gardenElement.style.height = '400px';
                
                // 恢复原始位置
                const mainContent = document.querySelector('.main-content');
                mainContent.insertBefore(gardenContainer, mainContent.firstChild);
                
                isFullscreen = false;
            }
        }
        
        // 更新显示值
        function updateDisplayValues() {
            growDbValue.textContent = config.growDb;
            shrinkDbValue.textContent = config.shrinkDb;
            growTimeValue.textContent = config.growTime;
            shrinkTimeValue.textContent = config.shrinkTime;
        }
        
        // 滑块更新函数
        function updateGrowDb() {
            config.growDb = parseInt(growDbSlider.value);
            growDbValue.textContent = config.growDb;
        }
        
        function updateShrinkDb() {
            config.shrinkDb = parseInt(shrinkDbSlider.value);
            shrinkDbValue.textContent = config.shrinkDb;
        }
        
        function updateGrowTime() {
            config.growTime = parseInt(growTimeSlider.value);
            growTimeValue.textContent = config.growTime;
        }
        
        function updateShrinkTime() {
            config.shrinkTime = parseInt(shrinkTimeSlider.value);
            shrinkTimeValue.textContent = config.shrinkTime;
        }
        
        // 切换监测状态
        function toggleMonitoring() {
            if (isMonitoring) {
                stopMonitoring();
            } else {
                startMonitoring();
            }
        }
        
        // 开始监测
        function startMonitoring() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert('您的浏览器不支持麦克风访问，请使用现代浏览器！');
                return;
            }
            
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(function(stream) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioContext.createAnalyser();
                    microphone = audioContext.createMediaStreamSource(stream);
                    
                    if (audioContext.createScriptProcessor) {
                        javascriptNode = audioContext.createScriptProcessor(2048, 1, 1);
                    } else if (audioContext.createJavaScriptNode) {
                        javascriptNode = audioContext.createJavaScriptNode(2048, 1, 1);
                    } else {
                        alert('您的浏览器不支持音频处理功能！');
                        return;
                    }
                    
                    analyser.smoothingTimeConstant = 0.8;
                    analyser.fftSize = 1024;
                    
                    microphone.connect(analyser);
                    analyser.connect(javascriptNode);
                    javascriptNode.connect(audioContext.destination);
                    
                    javascriptNode.onaudioprocess = processAudio;
                    
                    isMonitoring = true;
                    startBtn.textContent = '停止朗读检测';
                    micStatusElement.textContent = '麦克风已开启 - 正在检测音量';
                    micStatusElement.className = 'mic-status mic-on';
                    
                    // 重置计时器
                    resetTimers();
                    
                    // 启动连续状态检查定时器（每秒检查一次）
                    consecutiveCheckInterval = setInterval(checkConsecutiveStatus, 1000);
                })
                .catch(function(err) {
                    console.error('麦克风访问错误:', err);
                    alert('无法访问麦克风，请确保已授予麦克风权限！');
                });
        }
        
        // 停止监测
        function stopMonitoring() {
            if (javascriptNode) {
                javascriptNode.disconnect();
            }
            if (microphone) {
                microphone.disconnect();
            }
            if (audioContext) {
                audioContext.close();
            }
            
            // 清除连续状态检查定时器
            if (consecutiveCheckInterval) {
                clearInterval(consecutiveCheckInterval);
            }
            
            isMonitoring = false;
            startBtn.textContent = '开始朗读检测';
            micStatusElement.textContent = '麦克风未开启';
            micStatusElement.className = 'mic-status mic-off';
            currentDbElement.textContent = '0';
            dbLevelElement.style.width = '0%';
            meetingRequirementElement.textContent = '否';
        }
        
        // 重置计时器
        function resetTimers() {
            currentMeetingTime = 0;
            currentNotMeetingTime = 0;
            lastStatus = null;
        }
        
        // 处理音频数据
        function processAudio() {
            const array = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(array);
            
            let values = 0;
            for (let i = 0; i < array.length; i++) {
                values += array[i];
            }
            
            const average = values / array.length * 1.5;
            
            // 平滑分贝值
            const db = Math.round(
                config.dbSmoothingFactor * average + 
                (1 - config.dbSmoothingFactor) * lastDbValue
            );
            lastDbValue = db;
            
            // 更新UI
            currentDbElement.textContent = db;
            dbLevelElement.style.width = Math.min(db, 100) + '%';
            
            // 更新当前状态
            const isMeetingRequirement = db >= config.growDb;
            meetingRequirementElement.textContent = isMeetingRequirement ? '是' : '否';
        }
        
        // 每秒检查一次连续状态
        function checkConsecutiveStatus() {
            if (!isMonitoring) return;
            
            const currentStatus = meetingRequirementElement.textContent === '是';
            
            // 状态未改变，累加计时
            if (lastStatus === currentStatus) {
                if (currentStatus) {
                    currentMeetingTime++;
                } else {
                    currentNotMeetingTime++;
                }
            } else {
                // 状态改变，重置对应计时器
                if (currentStatus) {
                    currentMeetingTime = 1;
                    currentNotMeetingTime = 0;
                } else {
                    currentNotMeetingTime = 1;
                    currentMeetingTime = 0;
                }
                lastStatus = currentStatus;
            }
            
            // 更新总计时
            if (currentStatus) {
                meetingTime++;
            } else {
                notMeetingTime++;
            }
            
            // 检查是否应该生长新树 - 允许持续增加
            if (currentStatus && currentMeetingTime >= config.growTime) {
                addTree();
                // 不重置计时器，允许持续生长
                currentMeetingTime -= config.growTime;
            }
            
            // 检查是否应该消失一棵树 - 允许持续减少
            if (!currentStatus && lastDbValue < config.shrinkDb && 
                currentNotMeetingTime >= config.shrinkTime && trees.length > 0) {
                removeTree();
                // 不重置计时器，允许持续减少
                currentNotMeetingTime -= config.shrinkTime;
            }
            
            // 检查是否应该升级树木
            checkForTreeUpgrade();
            
            // 更新时间显示
            updateTimeDisplays();
        }
        
        // 更新所有时间显示
        function updateTimeDisplays() {
            meetingTimeElement.textContent = formatTime(meetingTime);
            notMeetingTimeElement.textContent = formatTime(notMeetingTime);
            currentMeetingTimeElement.textContent = formatTime(currentMeetingTime);
            currentNotMeetingTimeElement.textContent = formatTime(currentNotMeetingTime);
        }
        
        // 开始主计时器
        function startTimers() {
            setInterval(() => {
                if (!isMonitoring) {
                    updateTimeDisplays();
                }
            }, 1000);
        }
        
        // 添加一棵小树
        function addTree() {
            const tree = document.createElement('div');
            tree.className = 'tree small-tree';
            
            tree.innerHTML = `
                <svg viewBox="0 0 60 120" width="60" height="120">
                    <rect x="25" y="80" width="10" height="40" fill="#8d6e63" />
                    <circle cx="30" cy="50" r="25" fill="#4caf50" />
                    <circle cx="20" cy="40" r="15" fill="#66bb6a" />
                    <circle cx="40" cy="40" r="15" fill="#66bb6a" />
                    <circle cx="30" cy="30" r="12" fill="#81c784" />
                </svg>
            `;
            
            // 计算位置 - 循环排列树木
            const maxLeft = gardenElement.offsetWidth - 60;
            const treeWidth = 60;
            const spacing = 10;
            const totalWidth = treeWidth + spacing;
            const positionIndex = trees.length % Math.floor(maxLeft / totalWidth);
            let left = positionIndex * totalWidth;
            
            tree.style.left = left + 'px';
            
            gardenElement.appendChild(tree);
            trees.push(tree);
            
            updateTreeCount();
        }
        
        // 移除一棵树（修改为从小到大依次枯萎）
        function removeTree() {
            if (trees.length > 0) {
                // 优先移除小树
                const smallTreeIndex = trees.findIndex(tree => tree.classList.contains('small-tree'));
                if (smallTreeIndex !== -1) {
                    const tree = trees.splice(smallTreeIndex, 1)[0];
                    // 添加枯萎动画
                    tree.classList.add('tree-wither');
                    
                    setTimeout(() => {
                        gardenElement.removeChild(tree);
                        updateTreeCount();
                    }, 500);
                    return;
                }
                
                // 再移除大树
                const bigTreeIndex = trees.findIndex(tree => tree.classList.contains('big-tree'));
                if (bigTreeIndex !== -1) {
                    const tree = trees.splice(bigTreeIndex, 1)[0];
                    // 添加枯萎动画
                    tree.classList.add('tree-wither');
                    
                    setTimeout(() => {
                        gardenElement.removeChild(tree);
                        updateTreeCount();
                    }, 500);
                    return;
                }
                
                // 最后移除大大树
                const hugeTreeIndex = trees.findIndex(tree => tree.classList.contains('huge-tree'));
                if (hugeTreeIndex !== -1) {
                    const tree = trees.splice(hugeTreeIndex, 1)[0];
                    // 添加枯萎动画
                    tree.classList.add('tree-wither');
                    
                    setTimeout(() => {
                        gardenElement.removeChild(tree);
                        updateTreeCount();
                    }, 500);
                    return;
                }
                
                // 兜底方案，移除最后一棵树
                const tree = trees.pop();
                tree.classList.add('tree-wither');
                
                setTimeout(() => {
                    gardenElement.removeChild(tree);
                    updateTreeCount();
                }, 500);
            }
        }
        
        // 添加特定类型的树
        function addSpecificTree(type) {
            const tree = document.createElement('div');
            tree.className = `tree ${type}`;
            
            // 根据树的类型设置不同的SVG
            if (type === 'small-tree') {
                tree.innerHTML = `
                    <svg viewBox="0 0 60 120" width="60" height="120">
                        <rect x="25" y="80" width="10" height="40" fill="#8d6e63" />
                        <circle cx="30" cy="50" r="25" fill="#4caf50" />
                        <circle cx="20" cy="40" r="15" fill="#66bb6a" />
                        <circle cx="40" cy="40" r="15" fill="#66bb6a" />
                        <circle cx="30" cy="30" r="12" fill="#81c784" />
                    </svg>
                `;
            } else if (type === 'big-tree') {
                tree.innerHTML = `
                    <svg viewBox="0 0 100 200" width="100" height="200">
                        <rect x="40" y="150" width="20" height="50" fill="#5d4037" />
                        <circle cx="50" cy="100" r="40" fill="#388e3c" />
                        <circle cx="30" cy="80" r="25" fill="#4caf50" />
                        <circle cx="70" cy="80" r="25" fill="#4caf50" />
                        <circle cx="50" cy="60" r="20" fill="#66bb6a" />
                        <circle cx="30" cy="110" r="20" fill="#4caf50" />
                        <circle cx="70" cy="110" r="20" fill="#4caf50" />
                    </svg>
                `;
            } else if (type === 'huge-tree') {
                tree.innerHTML = `
                    <svg viewBox="0 0 160 300" width="160" height="300">
                        <rect x="70" y="220" width="20" height="80" fill="#3e2723" />
                        <circle cx="80" cy="150" r="60" fill="#2e7d32" />
                        <circle cx="40" cy="120" r="40" fill="#388e3c" />
                        <circle cx="120" cy="120" r="40" fill="#388e3c" />
                        <circle cx="80" cy="80" r="35" fill="#4caf50" />
                        <circle cx="40" cy="180" r="35" fill="#388e3c" />
                        <circle cx="120" cy="180" r="35" fill="#388e3c" />
                        <circle cx="80" cy="210" r="25" fill="#4caf50" />
                    </svg>
                `;
            }
            
            // 计算位置 - 循环排列树木
            let maxLeft, width, spacing;
            if (type === 'small-tree') {
                width = 60;
                spacing = 10;
            } else if (type === 'big-tree') {
                width = 100;
                spacing = 15;
            } else {
                width = 160;
                spacing = 20;
            }
            
            maxLeft = gardenElement.offsetWidth - width;
            const totalWidth = width + spacing;
            const positionIndex = trees.length % Math.floor(maxLeft / totalWidth);
            let left = positionIndex * totalWidth;
            
            tree.style.left = left + 'px';
            
            gardenElement.appendChild(tree);
            trees.push(tree);
        }
        
        // 检查并升级树木（4个低级树合成1个高级树）
        function checkForTreeUpgrade() {
            // 先检查是否可以从小树升级为大树
            const smallTrees = trees.filter(tree => tree.classList.contains('small-tree'));
            if (smallTrees.length >= config.treesToUpgrade) {
                // 移除4棵小树
                for (let i = 0; i < config.treesToUpgrade; i++) {
                    const tree = smallTrees[i];
                    gardenElement.removeChild(tree);
                    trees = trees.filter(t => t !== tree);
                }
                
                // 添加1棵大树
                addSpecificTree('big-tree');
                updateTreeCount();
                return; // 一次只升级一种类型
            }
            
            // 再检查是否可以从大树升级为大大树
            const bigTrees = trees.filter(tree => tree.classList.contains('big-tree'));
            if (bigTrees.length >= config.treesToUpgrade) {
                // 移除4棵大树
                for (let i = 0; i < config.treesToUpgrade; i++) {
                    const tree = bigTrees[i];
                    gardenElement.removeChild(tree);
                    trees = trees.filter(t => t !== tree);
                }
                
                // 添加1棵大大树
                addSpecificTree('huge-tree');
                updateTreeCount();
            }
        }
        
        // 更新树木计数
        function updateTreeCount() {
            const smallTrees = trees.filter(tree => tree.classList.contains('small-tree'));
            const bigTrees = trees.filter(tree => tree.classList.contains('big-tree'));
            const hugeTrees = trees.filter(tree => tree.classList.contains('huge-tree'));
            
            treeCountElement.textContent = smallTrees.length;
            bigTreeCountElement.textContent = bigTrees.length;
            hugeTreeCountElement.textContent = hugeTrees.length;
        }
        
        // 格式化时间显示
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        // 初始化应用
        window.addEventListener('load', init);
    </script>
</body>
</html>
